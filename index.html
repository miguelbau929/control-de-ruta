<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b45"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Control de Ruta">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Control de Ruta</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18251e;background:#f3f6f4;--green:#176b45;--line:#d9e2dc;--muted:#65736a}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:760px;margin-inline:auto}
header{padding:18px 4px 8px}h1{font-size:24px;margin:0}.muted{color:var(--muted);font-size:13px}
nav{position:relative;display:flex;justify-content:flex-end;padding:4px 0;z-index:5;background:#f3f6f4}
.menu-panel{position:absolute;right:0;top:42px;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 5px 18px #1223;display:none}.menu-panel.open{display:grid;gap:4px}.menu-panel button{text-align:left;background:#fff}
button{border:1px solid var(--line);background:white;color:#18251e;border-radius:11px;padding:11px;font-weight:650;font-size:14px}
nav #menuBtn{width:38px;height:34px;padding:0;font-size:20px;line-height:1}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #1225}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #ccd8d0;border-radius:10px;font:inherit;background:white;color:#18251e}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#edf4ef;border-radius:11px;padding:11px}.stat b{display:block;font-size:20px;margin-top:3px}
.big{font-size:16px;padding:15px 8px;flex:1}.paid{background:#16834b;color:white}.unpaid{background:#a33b36;color:white}
.extra{display:grid;grid-template-columns:1.15fr .7fr .85fr auto;gap:6px;align-items:end;margin:8px 0}.extra button{padding:10px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}
.small{font-size:12px}.right{text-align:right}.wide{width:100%;margin-top:9px}.danger{color:#a33b36}.pill{padding:4px 7px;border-radius:20px;background:#edf4ef;font-size:11px}
@media(max-width:380px){.extra{grid-template-columns:1fr 1fr}.extra>div:first-child{grid-column:span 2}}

/* Diseño compacto: reduce desplazamiento en teléfonos */
header{padding:8px 3px 4px} header .muted:first-child{font-size:10px;letter-spacing:.3px} h1{font-size:20px;line-height:1.15} .muted{font-size:11px}
nav{padding:2px 0} nav #menuBtn{width:34px;height:30px;font-size:18px}
button{padding:8px 9px;font-size:12px;border-radius:9px}
.panel{padding:10px;margin:7px 0;border-radius:12px}
label{font-size:10px;margin:5px 0 2px}
input,select{padding:8px;font-size:13px;border-radius:8px;min-height:36px}
.row{gap:6px}.grid{gap:6px}
.panel h2{font-size:19px;line-height:1.1}
.big{font-size:13px;padding:10px 6px}
.wide{margin-top:6px}
.extra{gap:4px;margin:5px 0}.extra button{padding:7px 8px}
.stat{padding:8px}.stat b{font-size:17px}
td,th{padding:5px 3px}
@media(max-width:430px){body{padding-left:8px;padding-right:8px}.panel{padding:9px;margin:6px 0}.extra{grid-template-columns:1.1fr .7fr .8fr auto}.extra label{font-size:9px}.extra input,.extra select{padding:6px;font-size:12px;min-height:33px}}
</style>
</head>
<body>
<header><div class="muted">VENTAS Y COBRANZA</div><h1>Control de Ruta</h1><div class="muted" id="saveState">Guardado en este teléfono</div></header>
<nav><button id="menuBtn" aria-label="Abrir menú">⋮</button><div id="menuPanel" class="menu-panel"><button data-tab="ruta">Ruta</button><button data-tab="clientes">Clientes</button><button data-tab="corte">Corte</button><button data-tab="adeudos">Adeudos</button></div></nav>
<main id="app"></main>
<script>
const KEY='controlRutaPWA_v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};if(!db||!Array.isArray(db.clients))db={clients:[],records:{},payments:[],date:today()};
db.records ||= {};db.payments ||= [];db.date ||= today();
let tab='ruta',idx=0,extras=[];
const $=s=>document.querySelector(s), money=n=>'$'+(Number(n)||0).toFixed(2), n=v=>Math.max(0,Number(v)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(d,id)=>d+'_'+id, rec=(d,id)=>db.records[key(d,id)]||null;
const bal=id=>n(db.clients.find(c=>c.id===id)?.balance);
const isAbono=x=>x.type==='Abono a adeudo';
const abonos=xs=>(xs||[]).filter(isAbono).reduce((s,x)=>s+n(x.price),0);
const extrasVenta=xs=>(xs||[]).filter(x=>!isAbono(x)).reduce((s,x)=>s+n(x.qty)*n(x.price),0);
const total=r=>n(r?.kg)*n(r?.price)+extrasVenta(r?.extras);
function save(){localStorage.setItem(KEY,JSON.stringify(db));$('#saveState').textContent='Guardado ✓'}
function changeTab(t){tab=t;$('#menuPanel').classList.remove('open');render()}
$('#menuBtn').onclick=()=>$('#menuPanel').classList.toggle('open');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));
function render(){if(tab==='ruta')route();if(tab==='clientes')clients();if(tab==='corte')cut();if(tab==='adeudos')debts()}
function options(){return db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function route(){
 if(!db.clients.length){$('#app').innerHTML='<div class="panel"><b>Primero agrega tus clientes.</b><p class="muted">Registra sus nombres y precio de tortillas por kilo.</p><button class="primary" id="go">Agregar clientes</button></div>';$('#go').onclick=()=>changeTab('clientes');return}
 idx=Math.min(idx,db.clients.length-1);let c=db.clients[idx],r=rec(db.date,c.id)||{kg:0,price:c.price,extras:[],status:'pending'};extras=JSON.parse(JSON.stringify(r.extras||[]));
 $('#app').innerHTML=`
 <div class="row"><div><label>Fecha de jornada</label><input id="date" type="date" value="${db.date}"></div><button id="today" style="margin-top:25px">Ir a hoy</button></div>
 <section class="panel"><div class="row"><span class="muted">CLIENTE ${idx+1} DE ${db.clients.length}</span><span class="muted right">Adeudo: ${money(bal(c.id))}</span></div><h2 style="margin:5px 0">${esc(c.name)}</h2><div class="muted">${esc(c.address||'Sin dirección')}</div><div class="row" style="margin-top:12px"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></section>
 <section class="panel"><b>Tortillas</b><div class="grid"><div><label>Cantidad (kg)</label><input id="kg" type="number" min="0" step=".01" value="${r.kg||''}"></div><div><label>Precio por kilo ($)</label><input id="price" type="number" min="0" step=".01" value="${r.price??c.price}"></div></div><p class="muted right">Importe: <b id="tort">${money(n(r.kg)*n(r.price??c.price))}</b></p></section>
 <section class="panel"><div class="row"><div><b>Extras</b><span class="muted"> · <span id="extraSum">${money(extrasVenta(r.extras))}</span></span></div><button id="extraMenu" aria-label="Mostrar extras" style="flex:0 0 34px;padding:5px">⋮</button></div><div id="extraDetails" hidden><div id="extras"></div><button id="addExtra" class="wide">＋ Agregar extra</button><p class="muted right">Abono a adeudo: <b id="abonoSum">${money(abonos(r.extras))}</b></p></div></section>
 <section class="panel"><div class="row"><span class="muted">TOTAL DE LA VENTA</span><b id="grand" style="font-size:24px">${money(total(r))}</b></div><p class="muted small">Los abonos reducen el adeudo y se cuentan aparte de las ventas.</p><div class="row"><button class="big paid" id="paid">SÍ PAGÓ</button><button class="big unpaid" id="unpaid">NO PAGÓ</button></div><p id="status" class="muted right">${r.status==='paid'?'Pagado':r.status==='unpaid'?'Pendiente':'Selecciona el pago'}</p><button class="primary wide" id="saveNext">GUARDAR Y SIGUIENTE →</button><button class="wide" id="skip">Sin entrega / saltar cliente</button></section>`;
 $('#date').onchange=e=>{db.date=e.target.value||today();idx=0;save();route()};$('#today').onclick=()=>{db.date=today();idx=0;save();route()};
 $('#prev').onclick=()=>{idx=Math.max(0,idx-1);route()};$('#next').onclick=()=>{idx=Math.min(db.clients.length-1,idx+1);route()};
 function totals(){let t=n($('#kg').value)*n($('#price').value);$('#tort').textContent=money(t);$('#extraSum').textContent=money(extrasVenta(extras));$('#abonoSum').textContent=money(abonos(extras));$('#grand').textContent=money(t+extrasVenta(extras))}
 $('#extraMenu').onclick=()=>$('#extraDetails').hidden=!$('#extraDetails').hidden;
 $('#kg').oninput=$('#price').oninput=totals;
 function drawExtras(){let host=$('#extras');host.innerHTML=extras.map((x,i)=>`<div class="extra"><div><label>Concepto</label><select data-i="${i}" data-f="type"><option ${x.type==='Masa'?'selected':''}>Masa</option><option ${x.type==='Totopos'?'selected':''}>Totopos</option><option ${x.type==='Desperdicio'?'selected':''}>Desperdicio</option><option ${isAbono(x)?'selected':''}>Abono a adeudo</option></select></div><div><label>${isAbono(x)?'Importe':'Cantidad'}</label><input data-i="${i}" data-f="${isAbono(x)?'price':'qty'}" type="number" min="0" step=".01" value="${isAbono(x)?(x.price||''):(x.qty??'')}"></div><div><label>${isAbono(x)?'—':'Precio'}</label>${isAbono(x)?'<div class="muted small" style="padding:12px 0">Un importe</div>':`<input data-i="${i}" data-f="price" type="number" min="0" step=".01" value="${x.price??''}">`}</div><button data-del="${i}">×</button></div>`).join('')||'<p class="muted small">Todavía no hay extras.</p>';
 host.querySelectorAll('[data-i]').forEach(el=>el.oninput=el.onchange=()=>{let i=+el.dataset.i,f=el.dataset.f;if(f==='type'){extras[i].type=el.value;extras[i].qty=1;drawExtras()}else extras[i][f]=n(el.value);totals()});
 host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{extras.splice(+b.dataset.del,1);drawExtras();totals()})}
 drawExtras();$('#addExtra').onclick=()=>{extras.push({type:'Masa',qty:1,price:0});drawExtras();totals()};
 let status=r.status||'pending';const setStatus=s=>{status=s;$('#status').textContent=s==='paid'?'Pagado':s==='unpaid'?'Pendiente':'Selecciona el pago'};$('#paid').onclick=()=>setStatus('paid');$('#unpaid').onclick=()=>setStatus('unpaid');
 function store(s){const k=key(db.date,c.id),old=rec(db.date,c.id);if(old?.status==='unpaid')c.balance=Math.max(0,bal(c.id)-total(old));c.balance+=abonos(old?.extras);db.payments=db.payments.filter(p=>p.sourceKey!==k);
 const amount=n($('#kg').value)*n($('#price').value)+extrasVenta(extras);if(s==='unpaid')c.balance+=amount;const a=abonos(extras);c.balance=Math.max(0,c.balance-a);if(a)db.payments.push({clientId:c.id,amount:a,date:db.date,note:'Abono registrado en ruta',sourceKey:k});
 db.records[k]={date:db.date,clientId:c.id,kg:n($('#kg').value),price:n($('#price').value),extras:JSON.parse(JSON.stringify(extras)),status:s,total:amount};save()}
 $('#saveNext').onclick=()=>{store(status==='pending'?'unpaid':status);if(idx<db.clients.length-1){idx++;route()}else alert('Jornada guardada. Llegaste al final de la ruta.')};
 $('#skip').onclick=()=>{let old=rec(db.date,c.id);if(old?.status==='unpaid')c.balance=Math.max(0,bal(c.id)-total(old));c.balance+=abonos(old?.extras);db.payments=db.payments.filter(p=>p.sourceKey!==key(db.date,c.id));db.records[key(db.date,c.id)]={date:db.date,clientId:c.id,kg:0,price:n($('#price').value),extras:[],status:'none',total:0};save();if(idx<db.clients.length-1){idx++;route()}else alert('Jornada guardada.')};
}
function clients(){
 $('#app').innerHTML=`<section class="panel"><b>Agregar cliente</b><label>Nombre o alias</label><input id="name" placeholder="Nombre"><label>Dirección o referencia</label><input id="address" placeholder="Dirección"><label>Precio de tortillas por kilo ($)</label><input id="price" type="number" min="0" step=".01" placeholder="Ej. 24"><button class="primary wide" id="add">Guardar cliente</button></section><section class="panel"><b>Orden de ruta</b><div id="list"></div></section>`;
 $('#add').onclick=()=>{let name=$('#name').value.trim();if(!name)return alert('Escribe un nombre');db.clients.push({id:'c'+Date.now()+Math.random().toString(16).slice(2),name,address:$('#address').value.trim(),price:n($('#price').value),balance:0});save();clients()};
 function list(){$('#list').innerHTML=db.clients.map((c,i)=>`<div class="panel"><div class="row"><div><b>${i+1}. ${esc(c.name)}</b><div class="muted">${esc(c.address)} · ${money(c.price)}/kg</div><div class="small">Adeudo: ${money(bal(c.id))}</div></div><div><button data-up="${i}" ${!i?'disabled':''}>↑</button><button data-down="${i}" ${i===db.clients.length-1?'disabled':''}>↓</button></div></div><div class="row"><button data-edit="${i}">Editar</button><button data-delete="${i}">Eliminar</button></div></div>`).join('')||'<p class="muted">No hay clientes todavía.</p>';
 $('#list').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;[db.clients[i-1],db.clients[i]]=[db.clients[i],db.clients[i-1]];save();list()});
 $('#list').querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;[db.clients[i+1],db.clients[i]]=[db.clients[i],db.clients[i+1]];save();list()});
 $('#list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let c=db.clients[+b.dataset.edit],v=prompt('Nombre',c.name);if(v===null)return;c.name=v||c.name;v=prompt('Dirección',c.address||'');if(v===null)return;c.address=v;v=prompt('Precio por kilo',c.price);if(v===null)return;c.price=n(v);save();list()});
 $('#list').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let i=+b.dataset.delete;if(confirm('¿Eliminar este cliente? Se conservan sus registros históricos.')){db.clients.splice(i,1);save();list()}})}
 list();
}
function cut(){
 const date=db.date,rows=db.clients.map(c=>({c,r:rec(date,c.id)})).filter(x=>x.r),kg=rows.reduce((s,x)=>s+n(x.r.kg),0),sales=rows.reduce((s,x)=>s+total(x.r),0),paid=rows.filter(x=>x.r.status==='paid').reduce((s,x)=>s+total(x.r),0),pending=rows.filter(x=>x.r.status==='unpaid').reduce((s,x)=>s+total(x.r),0),a=rows.reduce((s,x)=>s+abonos(x.r.extras),0);
 let d=new Date(date+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));let start=d.toISOString().slice(0,10),end=new Date(d.getTime()+6*86400000).toISOString().slice(0,10),wr=Object.values(db.records).filter(r=>r.date>=start&&r.date<=end);
 $('#app').innerHTML=`<section class="panel"><div class="row"><b>Corte del día</b><input id="cutdate" type="date" value="${date}" style="max-width:155px"></div><div class="grid" style="margin-top:12px"><div class="stat">Ventas<b>${money(sales)}</b></div><div class="stat">Cobrado hoy<b>${money(paid+a)}</b></div><div class="stat">Abonos a adeudos<b>${money(a)}</b></div><div class="stat">Pendiente de hoy<b>${money(pending)}</b></div><div class="stat">Tortillas kg<b>${kg.toFixed(2)}</b></div></div></section>
 <section class="panel"><b>Detalle por cliente</b><div style="overflow-x:auto"><table><thead><tr><th>Cliente</th><th>Kg</th><th>Precio/kg</th><th>Extras</th><th>Total</th><th>Pago</th></tr></thead><tbody>${rows.map(({c,r})=>`<tr><td>${esc(c.name)}<div class="muted">${(r.extras||[]).map(x=>esc(x.type)+': '+money(isAbono(x)?x.price:n(x.qty)*n(x.price))).join('<br>')}</div></td><td>${n(r.kg).toFixed(2)}</td><td>${money(r.price)}</td><td>${money(extrasVenta(r.extras))}${abonos(r.extras)?'<div class="muted">Abono '+money(abonos(r.extras))+'</div>':''}</td><td><b>${money(total(r))}</b></td><td>${r.status==='paid'?'Pagó':r.status==='unpaid'?'Debe':'Sin entrega'}</td></tr>`).join('')||'<tr><td colspan="6">Sin registros</td></tr>'}</tbody></table></div></section>
 <section class="panel"><b>Resumen semanal</b><div class="muted">${start} al ${end}</div><div class="grid"><div class="stat">Ventas<b>${money(wr.reduce((s,r)=>s+total(r),0))}</b></div><div class="stat">Tortillas kg<b>${wr.reduce((s,r)=>s+n(r.kg),0).toFixed(2)}</b></div></div></section><button class="primary wide" id="share">Compartir corte</button><button class="wide" id="backup">Descargar respaldo de datos</button>`;
 $('#cutdate').onchange=e=>{db.date=e.target.value||today();save();cut()};
 $('#backup').onclick=()=>download('control-ruta-respaldo.json',JSON.stringify(db,null,2),'application/json');
 $('#share').onclick=()=>{let text=`CORTE ${date}\nVentas ${money(sales)}\nCobrado hoy ${money(paid+a)}\nAbonos ${money(a)}\nPendiente ${money(pending)}\nTortillas ${kg.toFixed(2)} kg\n\n`+rows.map(({c,r})=>`${c.name}: ${n(r.kg)} kg x ${money(r.price)}\n${(r.extras||[]).map(x=>`${x.type}: ${isAbono(x)?money(x.price):n(x.qty)+' x '+money(x.price)}`).join('\n')}\nVenta total: ${money(total(r))}`).join('\n\n');if(navigator.share)navigator.share({title:'Corte de ruta',text}).catch(()=>{});else alert(text)};
}
function download(name,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function debts(){
 $('#app').innerHTML=`<section class="panel"><b>Adeudos de clientes</b><p class="muted">Puedes registrar abonos desde aquí o desde Extras en la Ruta.</p><div class="stat">Saldo pendiente total<b>${money(db.clients.reduce((s,c)=>s+bal(c.id),0))}</b></div></section><section class="panel"><b>Registrar abono</b><label>Cliente</label><select id="who">${options()}</select><label>Importe recibido ($)</label><input id="amount" type="number" min=".01" step=".01"><label>Nota (opcional)</label><input id="note" placeholder="Abono o liquidación"><button class="primary wide" id="register">Registrar pago</button></section><section class="panel"><b>Saldos por cliente</b>${db.clients.map(c=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(c.name)}</span><b class="right">${money(bal(c.id))}</b></div>`).join('')}</section><section class="panel"><b>Historial de abonos</b>${db.payments.slice().reverse().map(p=>`<div class="row small" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(db.clients.find(c=>c.id===p.clientId)?.name||'Cliente')}<div class="muted">${esc(p.date)} ${esc(p.note||'')}</div></span><b class="right">${money(p.amount)}</b></div>`).join('')||'<p class="muted">Todavía no hay abonos.</p>'}</section><button class="wide" id="backup">Descargar respaldo de datos</button>`;
 $('#register').onclick=()=>{let id=$('#who').value,a=n($('#amount').value),c=db.clients.find(x=>x.id===id);if(!c||!a)return alert('Selecciona un cliente e indica el importe.');if(a>bal(id)&&!confirm('El importe supera el adeudo. ¿Continuar?'))return;c.balance=Math.max(0,bal(id)-a);db.payments.push({clientId:id,amount:a,date:today(),note:$('#note').value.trim()});save();debts()};
 $('#backup').onclick=()=>download('control-ruta-respaldo.json',JSON.stringify(db,null,2),'application/json');
}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
